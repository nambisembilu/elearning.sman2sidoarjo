# Stack deployment untuk Coolify: aplikasi (Express + SPA) + MySQL.
# Coolify menyuntikkan variabel dari tab Environment. Nilai default aman untuk
# uji coba lokal, tetapi WAJIB di-override untuk produksi (JWT_SECRET & password DB).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Frontend memanggil API same-origin lewat path relatif.
        VITE_API_URL: /api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-elearning}
      DB_PASSWORD: ${DB_PASSWORD:-elearning_pass}
      DB_NAME: ${DB_NAME:-elearning_sma}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      # Same-origin, jadi CORS tidak diperlukan; isi jika ada domain lain.
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-}
    ports:
      # Coolify mem-proxy port ini (host:container). Ubah lewat Coolify bila perlu.
      - "4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-elearning_sma}
      MYSQL_USER: ${DB_USER:-elearning}
      MYSQL_PASSWORD: ${DB_PASSWORD:-elearning_pass}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_pass}
    volumes:
      - db_data:/var/lib/mysql
      # Seed otomatis saat volume DB masih kosong (import sekali di awal).
      - ./database/elearning_sma.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  uploads:
  db_data:
